<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Siki &amp; Zana: The Late Market</title>
    <link rel="stylesheet" href="/src/styles/tokens.css" />
  </head>
  <body>
    <!-- The market never leaves: the night-market painting is a persistent
         dimmed backdrop behind EVERY chapter, so Ch.2/Ch.3 live in the same
         place as Ch.1 instead of clearing back to a bare form. -->
    <img id="market-bg" class="lm-market-bg" src="/src/assets/market-bg.png" alt="" aria-hidden="true" />
    <!-- Start overlay is our own audio-unlock surface: itch.io's launch click
         does NOT unlock Web Audio inside the iframe (GDD App.C). -->
    <div id="start" role="dialog" aria-labelledby="start-title">
      <img class="lm-title-art" src="/src/assets/cover.png" alt="The Late Market — a night market street with lanterns, Siki and Zana at a stall, and three stallholders keeping their books" />
      <div class="lm-title-panel">
        <h1 id="start-title">Siki &amp; Zana: The Late Market</h1>
        <p class="lm-title-tag">A night market opens where your uncollected invoices sleep.</p>
        <div class="lm-title-actions">
          <button id="start-btn" type="button">▶ Begin — sound on</button>
          <button id="start-muted" type="button">Begin — silent first</button>
        </div>
        <p class="lm-title-keys">One hand is enough: <kbd>1</kbd>–<kbd>3</kbd> choose, <kbd>Enter</kbd> continues. Clicking works too.</p>
        <!-- Two markets, two lawful remedies. The Gulf run is not the UK run
             with a different symbol: there the late-payment charge is the
             contractual fee you agreed to, not statutory interest. -->
        <fieldset class="lm-market-pick">
          <legend>Which market?</legend>
          <label><input type="radio" name="market" value="uk" checked /> UK — pounds, statutory interest</label>
          <label><input type="radio" name="market" value="souq" /> Gulf — AED, contractual late fee</label>
        </fieldset>
        <details id="opts">
          <summary>Options</summary>
          <div class="lm-title-opts">
            <label><input type="checkbox" id="opt-sound" checked /> Sound</label>
            <label><input type="checkbox" id="opt-music" checked /> Music bed</label>
            <label>Text size
              <select id="opt-textsize">
                <option value="sm">Small</option>
                <option value="md" selected>Normal</option>
                <option value="lg">Large</option>
              </select>
            </label>
            <label><input type="checkbox" id="opt-simplelang" /> Simple language</label>
          </div>
        </details>
        <button id="purge-save" type="button" class="lm-title-erase">Erase my saved progress</button>
      </div>
    </div>
    <main id="game" hidden></main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
